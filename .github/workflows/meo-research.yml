name: MEO Research Automation

permissions:
  contents: write
  
on:
  schedule:
    # 毎朝 8時（UTC）に実行
    # 日本時間では 17時（UTC+9）になります
    - cron: '0 23 * * *'
  workflow_dispatch:  # 手動でも実行可能

jobs:
  meo-research:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tweepy anthropic requests
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run MEO Research Script
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python scripts/meo_research.py
    
    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A results/
        git commit -m "Add MEO research results for $(date +%Y-%m-%d)" || true
        git push
